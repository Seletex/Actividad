services:
  - type: web
    name: actividades-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --config gunicorn_config.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: actividades-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"

databases:
  - name: actividades-db
    # El plan "free" de Render caduca a los 30 dias y Render elimina la base
    # con todos sus datos, sin conservar copia. Ya se perdio la base de este
    # proyecto por esa causa (22/09/2026 - 22/10/2026). El plan "starter"
    # no caduca e incluye respaldos automaticos.
    plan: starter
